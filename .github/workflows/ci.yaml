name: "Continous Integration"

"on":
  pull_request:
    branches:
      - main

jobs:
  automation-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout All Code
        uses: actions/checkout@v4
      - name: Setup Node.JS
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies
        run: npm install
      - name: Run Unit Tests
        run: npm run ci:test
      - name: Run End to End Tests
        run: npm run ci:e2e